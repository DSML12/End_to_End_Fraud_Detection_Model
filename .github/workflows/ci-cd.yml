name: CI/CD Pipeline
on:
  push:
    branches: [ main ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Build and push the API image
      - name: Build, Tag, and Push fraud-api
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          ECR_REGISTRY=049428442670.dkr.ecr.ca-central-1.amazonaws.com
          ECR_REPOSITORY=fraud-api
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f docker/Dockerfile.api .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # Build and push the Lambda stream-scorer image
      - name: Build, Tag, and Push fraud-lambda
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          ECR_REGISTRY=049428442670.dkr.ecr.ca-central-1.amazonaws.com
          ECR_REPOSITORY=fraud-lambda
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f docker/Dockerfile.lambda .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # Deploy the API to ECS
      - name: Deploy fraud-api-service
        run: |
          aws ecs update-service \
            --cluster fraud-api-cluster \
            --service fraud-api-task-service \
            --force-new-deployment

      # Point the Lambda at the freshly pushed image
      - name: Deploy fraud-stream-scorer
        run: |
          ECR_REGISTRY=049428442670.dkr.ecr.ca-central-1.amazonaws.com
          aws lambda update-function-code \
            --function-name fraud-stream-scorer \
            --image-uri $ECR_REGISTRY/fraud-lambda:${GITHUB_SHA} \
            --region ca-central-1
